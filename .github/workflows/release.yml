name: Build and publish release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/security.yml
  release:
    needs: checks
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Build WordPress plugin ZIP
        shell: bash
        run: |
          TAG_VERSION="$(printf '%s' "$GITHUB_REF_NAME" | sed 's/^v//')"
          PLUGIN_VERSION="$(grep -m1 'Version:' bible.php | sed -E 's/.*Version:[[:space:]]*([0-9A-Za-z.+-]+).*/\1/')"
          if [ "$TAG_VERSION" != "$PLUGIN_VERSION" ]; then
            echo "Tag version $TAG_VERSION does not match plugin version $PLUGIN_VERSION"
            exit 1
          fi

          find . -name '*.php' -not -path './dist/*' -print0 | xargs -0 -n1 php -l
          node --check assets/js/bible-frontend.js
          grep -F "define( 'BIBLE_PLUGIN_VERSION', '$TAG_VERSION' );" bible.php
          grep -Fx "Stable tag: $TAG_VERSION" readme.txt
          mkdir -p dist/bible
          cp bible.php readme.txt index.php dist/bible/
          cp -R assets includes modules dist/bible/
          (cd dist && zip -qr "$RUNNER_TEMP/bible.zip" bible)

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" "$RUNNER_TEMP/bible.zip" --title "$GITHUB_REF_NAME" --generate-notes
